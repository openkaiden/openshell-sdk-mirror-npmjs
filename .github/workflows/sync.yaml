name: Sync @nvidia/openshell-sdk to npmjs @openkaiden/opnshll-sdk

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: >
          Specific version to publish (e.g. 0.0.116).
          Leave empty to sync the latest version.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror package to npmjs
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Determine version to sync
        id: version
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            echo "value=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(./scripts/fetch-latest-version.sh)
            echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}

      - name: Check if already published
        id: check
        run: |
          set +e
          ./scripts/check-published.sh "${SYNC_VERSION}"
          STATUS=$?
          set -e
          if [ ${STATUS} -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ ${STATUS} -eq 1 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected error from check-published.sh (exit ${STATUS})" >&2
            exit 1
          fi
        env:
          SYNC_VERSION: ${{ steps.version.outputs.value }}

      - name: Repackage
        if: steps.check.outputs.skip != 'true'
        id: repackage
        run: |
          TARBALL=$(./scripts/repackage.sh "${SYNC_VERSION}")
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_VERSION: ${{ steps.version.outputs.value }}

      - name: Publish to npmjs with provenance
        if: steps.check.outputs.skip != 'true'
        run: npm publish "${TARBALL_PATH}" --provenance --access public
        env:
          TARBALL_PATH: ${{ steps.repackage.outputs.tarball }}

      - name: Summary
        run: |
          if [ "${SKIP}" = "true" ]; then
            echo "### No action needed" >> "$GITHUB_STEP_SUMMARY"
            echo "@openkaiden/opnshll-sdk@${SYNC_VERSION} is already on npmjs.org" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "@openkaiden/opnshll-sdk@${SYNC_VERSION} published to npmjs.org with provenance" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SYNC_VERSION: ${{ steps.version.outputs.value }}
          SKIP: ${{ steps.check.outputs.skip }}
