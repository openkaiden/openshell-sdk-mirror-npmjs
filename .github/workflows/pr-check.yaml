name: pr-check

permissions:
  contents: read

on: [pull_request]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: scripts

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # v4.0.0
        with:
          support-install: true
          assert-install: true
          file-install: false
          detik-install: false

      - name: Set BATS_LIB_PATH
        run: echo "BATS_LIB_PATH=${SUPPORT_DESTDIR%/*}" >> "$GITHUB_ENV"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run tests
        run: bats test/
